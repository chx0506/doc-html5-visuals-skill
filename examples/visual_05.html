<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="use-iframe" content="true"><meta name="html-box-height-mode" content="auto">
<meta name="description" content="Character.AI 四条互动玩法支线雷达对比：Series/Scenes/Reads/AvatarFX 在发布时间、覆盖受众、数据可得性、爆款样本量四个维度上的强弱">
<title>c.ai 四条互动玩法支线对比</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#fff;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:6px}#c{width:100%;height:460px}</style>
</head><body>
<div id="c"></div>
<script src="https://unpkg.byted-static.com/echarts/5.5.1/dist/echarts.min.js" integrity="sha384-Mx5lkUEQPM1pOJCwFtUICyX45KNojXbkWdYhkKUKsbv391mavbfoAmONbzkgYPzR" crossorigin="anonymous"></script>
<script>
var PALETTE=['#2f6fed','#f59e0b','#10b981','#ef4444'];
var chart=echarts.init(document.getElementById('c'),null,{renderer:'svg'});
chart.setOption({
  color:PALETTE,
  title:{text:'c.ai Series 爆款样本最厚、AvatarFX 发布最早；Scenes/Reads 公开数据最稀',subtext:'定性评分 1-5，综合发布时间 / 覆盖受众 / 数据可得性 / 爆款样本量',left:'center',textStyle:{fontSize:15,color:'#1f2d3d'},subtextStyle:{color:'#94a3b8'}},
  legend:{bottom:4,data:['Series','Scenes','Reads','AvatarFX']},
  radar:{indicator:[
    {name:'发布早（↑越早）',max:5},
    {name:'覆盖受众广度',max:5},
    {name:'公开数据可得性',max:5},
    {name:'爆款样本量',max:5}
  ],radius:'62%',splitNumber:5,axisName:{color:'#334155',fontSize:12}},
  series:[{type:'radar',data:[
    {value:[2,4,3,5],name:'Series',areaStyle:{opacity:0.15}},
    {value:[2.5,3,1.5,2],name:'Scenes',areaStyle:{opacity:0.15}},
    {value:[2,3,1.5,2],name:'Reads',areaStyle:{opacity:0.15}},
    {value:[3,3.5,2,2.5],name:'AvatarFX',areaStyle:{opacity:0.15}}
  ]}]
});
window.addEventListener('resize',function(){chart.resize();});
</script></body></html>
