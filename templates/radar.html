<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="use-iframe" content="true"><meta name="html-box-height-mode" content="auto">
<meta name="description" content="{{一句话：雷达对比对象与维度}}">
<title>{{雷达图标题}}</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#fff;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:6px}#c{width:100%;height:460px}</style>
</head><body>
<div id="c"></div>
<script src="https://unpkg.byted-static.com/echarts/5.5.1/dist/echarts.min.js" integrity="sha384-Mx5lkUEQPM1pOJCwFtUICyX45KNojXbkWdYhkKUKsbv391mavbfoAmONbzkgYPzR" crossorigin="anonymous"></script>
<script>
var PALETTE=['#2f6fed','#f59e0b','#10b981','#ef4444','#64748b'];
var chart=echarts.init(document.getElementById('c'),null,{renderer:'svg'});
chart.setOption({
  color:PALETTE,
  title:{
    text:'{{结论句}}',
    subtext:'{{维度与评分口径说明}}',
    left:'center',
    textStyle:{fontSize:15,color:'#1f2d3d'},
    subtextStyle:{color:'#94a3b8'}
  },
  legend:{bottom:4,data:['系列A','系列B','系列C']},
  radar:{
    indicator:[
      {name:'维度1',max:5},
      {name:'维度2',max:5},
      {name:'维度3',max:5},
      {name:'维度4',max:5}
    ],
    radius:'62%',splitNumber:5,
    axisName:{color:'#334155',fontSize:12}
  },
  series:[{type:'radar',data:[
    {value:[3,4,2,5],name:'系列A',areaStyle:{opacity:0.15}},
    {value:[2,3,4,2],name:'系列B',areaStyle:{opacity:0.15}},
    {value:[4,2,3,3],name:'系列C',areaStyle:{opacity:0.15}}
  ]}]
});
window.addEventListener('resize',function(){chart.resize();});
</script></body></html>
