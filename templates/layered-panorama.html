<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="auto">
<meta name="description" content="{{一句话：分层全景在讲什么}}">
<title>{{全景标题}}</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--brand:#2f6fed;--brand-2:#60a5fa;--amber:#f59e0b;--green:#10b981;--ink:#1f2d3d;--ink-2:#334155;--mute:#94a3b8;--line:#e8edf3}
  body{background:#fff;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);padding:16px 12px}
  .p-title{font-size:19px;font-weight:800;text-align:center;margin-bottom:2px}
  .p-sub{font-size:12px;color:var(--mute);text-align:center;margin-bottom:18px}
  .stack{display:flex;flex-direction:column;gap:12px;max-width:1000px;margin:0 auto}
  .layer{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:linear-gradient(180deg,#fff,#fbfcfe)}
  .layer-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .badge{font-size:11px;font-weight:700;color:#fff;padding:2px 9px;border-radius:20px}
  .lname{font-size:15px;font-weight:800}
  .ldesc{font-size:11.5px;color:var(--mute)}
  .cells{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .cell{border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:#fff}
  .cell b{display:block;font-size:12.5px;color:var(--ink);margin-bottom:3px}
  .cell span{font-size:11px;color:var(--ink-2);line-height:1.45}
  .l4 .badge{background:var(--green)} .l4{border-left:5px solid var(--green)}
  .l3 .badge{background:var(--brand)} .l3{border-left:5px solid var(--brand)}
  .l2 .badge{background:var(--brand-2)} .l2{border-left:5px solid var(--brand-2)}
  .l1 .badge{background:var(--amber)} .l1{border-left:5px solid var(--amber)}
  .l0 .badge{background:#64748b} .l0{border-left:5px solid #64748b}
  @media(max-width:720px){.cells{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
  <div class="p-title">{{主标题：品类 × 数量}}</div>
  <div class="p-sub">{{纵轴含义 · 层内含义}}</div>
  <div class="stack">
    <div class="layer l4">
      <div class="layer-head"><span class="badge">五 · {{层名}}</span><span class="lname">{{层标题}}</span><span class="ldesc">{{层说明}}</span></div>
      <div class="cells">
        <div class="cell"><b>{{产品}}</b><span>{{一句话定位}}</span></div>
      </div>
    </div>
    <div class="layer l3">
      <div class="layer-head"><span class="badge">四 · {{层名}}</span><span class="lname">{{层标题}}</span><span class="ldesc">{{层说明}}</span></div>
      <div class="cells">
        <div class="cell"><b>{{产品}}</b><span>{{一句话定位}}</span></div>
        <div class="cell"><b>{{产品}}</b><span>{{一句话定位}}</span></div>
      </div>
    </div>
    <div class="layer l0">
      <div class="layer-head"><span class="badge">一 · {{层名}}</span><span class="lname">{{层标题}}</span><span class="ldesc">{{层说明}}</span></div>
      <div class="cells">
        <div class="cell"><b>{{产品}}</b><span>{{一句话定位}}</span></div>
      </div>
    </div>
  </div>
</body>
</html>
